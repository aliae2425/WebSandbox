<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Échouée</title>
<style>
  :root { --fg: #f3ead8; --dim: #f3ead899; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #000; color: var(--fg); font-family: var(--mono); }
  .scroller { height: 600vh; }
  .hero { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .ui { position: absolute; inset: 0; pointer-events: none; padding: clamp(16px, 3vw, 40px);
        display: grid; grid-template: auto 1fr auto / 1fr auto; text-shadow: 0 0 12px #000; }
  h1 { font-size: clamp(32px, 7vw, 96px); font-weight: 700; letter-spacing: -.04em; line-height: .9; }
  .sub { color: var(--dim); font-size: 13px; margin-top: 12px; }
  .sound { pointer-events: auto; align-self: start; background: none; border: 0; color: var(--dim);
           font: 13px var(--mono); cursor: pointer; padding: 4px; }
  .sound:hover { color: var(--fg); }
  .clock { grid-row: 3; font-size: clamp(28px, 5vw, 64px); font-variant-numeric: tabular-nums; }
  .phase { color: var(--dim); font-size: 13px; white-space: pre; }
  .hint { grid-row: 3; grid-column: 2; align-self: end; color: var(--dim); font-size: 13px; text-align: right; }
  .bubble { position: absolute; left: 0; top: 0; font-size: 14px; font-weight: 700; white-space: pre;
            color: #fff; text-shadow: 0 0 8px #000; pointer-events: none; opacity: 0; transition: opacity .15s; }
  @media (max-width: 600px) { .hint { display: none; } }
</style>
</head>
<body>
<div class="scroller">
  <section class="hero">
    <canvas id="c"></canvas>
    <div class="ui">
      <div><h1>ÉCHOUÉE</h1><p class="sub">une barque, une mouette, une journée.</p></div>
      <button class="sound" id="sound">[ son : off ]</button>
      <div><div class="clock" id="clock">06:30</div><div class="phase" id="phase"></div></div>
      <div class="hint">défiler ↓ pour faire passer le jour<br>bouger la souris pour tourner</div>
    </div>
    <div class="bubble" id="bubble"></div>
  </section>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 25, 220);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1200);
const target = new THREE.Vector3(0, 0.7, 0.8);

// ---------- ciel : dégradé + soleil + lune + étoiles ----------
const skyU = {
  uZenith: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
  uSunDir: { value: new THREE.Vector3() }, uMoonDir: { value: new THREE.Vector3() },
  uSunCol: { value: new THREE.Color() }, uSunVis: { value: 0 }, uMoonVis: { value: 0 },
  uNight: { value: 0 }, uTime: { value: 0 },
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vW; void main(){ vW = (modelMatrix*vec4(position,1.)).xyz; gl_Position = projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  fragmentShader: `
    uniform vec3 uZenith,uHorizon,uSunDir,uMoonDir,uSunCol; uniform float uSunVis,uMoonVis,uNight,uTime;
    varying vec3 vW;
    float hash(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
    void main(){
      vec3 d = normalize(vW - cameraPosition);
      vec3 col = mix(uHorizon, uZenith, pow(max(d.y,0.),.5));
      float sd = dot(d,uSunDir);
      col += uSunCol*(smoothstep(.9991,.9994,sd)*3. + pow(max(sd,0.),700.)*.3 + pow(max(sd,0.),20.)*.06)*uSunVis;
      float md = dot(d,uMoonDir);
      col += vec3(.85,.9,1.)*(smoothstep(.9982,.9986,md)*1.4 + pow(max(md,0.),900.)*.2)*uMoonVis;
      vec3 c = floor(d*140.); float s = hash(c);
      col += step(.993,s)*uNight*smoothstep(.02,.2,d.y)*(.9+.5*sin(uTime*2.+s*90.))*1.6;
      gl_FragColor = vec4(col,1.);
    }`,
}));
scene.add(sky);

// ---------- mer : reflets soleil / lune ----------
const waterU = {
  uTime: { value: 0 }, uSunDir: skyU.uSunDir, uMoonDir: skyU.uMoonDir, uSunCol: skyU.uSunCol,
  uSunI: { value: 0 }, uMoonI: { value: 0 }, uZenith: skyU.uZenith, uHorizon: skyU.uHorizon,
  uDeep: { value: new THREE.Color() }, uFog: { value: scene.fog.color }, uFogNear: { value: scene.fog.near }, uFogFar: { value: scene.fog.far },
};
const water = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: waterU,
  vertexShader: `varying vec3 vW; void main(){ vW = (modelMatrix*vec4(position,1.)).xyz; gl_Position = projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  fragmentShader: `
    uniform float uTime,uSunI,uMoonI,uFogNear,uFogFar; uniform vec3 uSunDir,uMoonDir,uSunCol,uZenith,uHorizon,uDeep,uFog;
    varying vec3 vW;
    void main(){
      vec2 p = vW.xz, g = vec2(0.);
      for(int i=0;i<7;i++){
        float fi = float(i), a = fi*2.39996;
        vec2 dir = vec2(cos(a),sin(a));
        float f = .35*pow(1.55,fi), amp = .11/pow(1.5,fi);
        g += dir*f*amp*cos(dot(dir,p)*f + uTime*(.6+fi*.25));
      }
      vec3 n = normalize(vec3(-g.x,1.,-g.y));
      vec3 v = normalize(cameraPosition - vW), r = reflect(-v,n);
      r.y = abs(r.y);
      float fres = .03 + .97*pow(1.-max(dot(n,v),0.),5.);
      vec3 col = mix(uDeep, mix(uHorizon,uZenith,pow(r.y,.5))*.7, fres);
      float ss = max(dot(r,uSunDir),0.), ms = max(dot(r,uMoonDir),0.);
      col += uSunCol*uSunI*(pow(ss,900.)*10. + pow(ss,160.)*.3);
      col += vec3(.75,.85,1.)*uMoonI*(pow(ms,700.)*8. + pow(ms,60.)*.5);
      float shore = smoothstep(-2.2,-.6, vW.z + .35*sin(uTime*.9 + vW.x*.4));
      col = mix(col, vec3(.8,.85,.85)*(.25+uSunI*.25+uMoonI*.4), shore*.6);
      col = mix(col, uFog, smoothstep(uFogNear,uFogFar,length(vW-cameraPosition)));
      gl_FragColor = vec4(col,1.);
    }`,
}));
scene.add(water);

// ---------- plage ----------
const BOAT = new THREE.Vector3(0, 0, 0.6);
const sandH = (x, z) => {
  const dx = x - BOAT.x - 1.2, dz = z - BOAT.z - 0.9;
  return (z + 1.2) * 0.11
    + 0.07 * Math.sin(x * 0.6) + 0.05 * Math.sin(x * 1.4 + z * 0.8) + 0.03 * Math.sin(z * 2.3 - x * 0.5)
    + 0.3 * Math.exp(-(dx * dx * 0.4 + dz * dz) / 2.5);
};
const sandGeo = new THREE.PlaneGeometry(160, 46, 220, 90).rotateX(-Math.PI / 2).translate(0, 0, 12);
const sp = sandGeo.attributes.position;
for (let i = 0; i < sp.count; i++) sp.setY(i, sandH(sp.getX(i), sp.getZ(i)));
sandGeo.computeVertexNormals();
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xcdb38a, roughness: 1, flatShading: true }));
sand.receiveShadow = true;
scene.add(sand);

// ---------- barque ----------
const wood = new THREE.MeshStandardMaterial({ color: 0xf4eedf, roughness: 0.9, flatShading: true, side: THREE.DoubleSide });
const woodDark = new THREE.MeshStandardMaterial({ color: 0x2f5a80, roughness: 1, flatShading: true });
const L = 6.2, W = 2.1, D = 1.0;
const halfW = u => W / 2 * Math.sqrt(Math.max(0, 1 - Math.pow(Math.abs(u) * (u < 0 ? 0.93 : 1), u < 0 ? 4 : 2.2)));
const sheer = u => 0.35 * u * u + (u > 0 ? 0.25 * u * u * u : 0);

const hullGeo = new THREE.PlaneGeometry(1, 1, 48, 9);
const hp = hullGeo.attributes.position;
for (let i = 0; i < hp.count; i++) {
  const u = hp.getX(i) * 2, v = (hp.getY(i) + 0.5) * Math.PI, w = halfW(u), s = sheer(u);
  hp.setXYZ(i, u * L / 2, s - (D + s * 0.6) * Math.sin(v) * (0.35 + 0.65 * Math.min(1, w / (W * 0.25))), w * Math.cos(v));
}
hullGeo.computeVertexNormals();

const boat = new THREE.Group();
const hull = new THREE.Mesh(hullGeo, wood);
const rimPts = side => Array.from({ length: 25 }, (_, k) => { const u = -1 + k / 12; return new THREE.Vector3(u * L / 2, sheer(u), side * halfW(u)); });
const rim = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([...rimPts(1), ...rimPts(-1).reverse()], true), 160, 0.07, 5, true), woodDark);
boat.add(hull, rim);
for (const u of [-0.6, -0.25, 0.1, 0.45]) { // membrures
  const w = halfW(u) * 0.94, s = sheer(u);
  const pts = Array.from({ length: 9 }, (_, k) => { const v = k / 8 * Math.PI; return new THREE.Vector3(u * L / 2, s - (D + s * 0.6) * Math.sin(v) * 0.94, w * Math.cos(v)); });
  boat.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, 0.045, 4), woodDark));
}
const seat = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.07, halfW(-0.2) * 1.9), woodDark);
seat.position.set(-0.2 * L / 2, sheer(-0.2) - 0.3, 0);
const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 1.7, 6), woodDark);
mast.position.set(0.15 * L / 2, 0.35, 0.05); mast.rotation.set(0.25, 0, -0.35);
const oar = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.05, 0.14), woodDark);
oar.position.set(-1.6, -0.05, 1.5); oar.rotation.set(0.1, 0.5, 0.15);
boat.add(seat, mast);
boat.traverse(o => { o.castShadow = true; o.receiveShadow = true; });

const boatTilt = new THREE.Group();
boatTilt.rotation.set(0.22, 0, 0.07); // gîte + proue relevée
boatTilt.add(boat);
const boatRoot = new THREE.Group();
boatRoot.position.set(BOAT.x, 0.38, BOAT.z);
boatRoot.rotation.y = -0.85;
boatRoot.add(boatTilt);
scene.add(boatRoot, oar);
oar.castShadow = true;

// ---------- mouette (goéland argenté, low-poly) ----------
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, flatShading: true, ...o });
const white = mat(0xffffff, { emissive: 0x1a1a1a }), grey = mat(0x9aa5b0), black = new THREE.MeshBasicMaterial({ color: 0x000000 });
const yellow = mat(0xf2c230, { roughness: 0.5 }), pink = mat(0xe3a08c), red = mat(0xd9381e);
const mesh = (geo, m, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) => {
  const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); o.castShadow = true; return o;
};
const ball = new THREE.SphereGeometry(1, 10, 7);
const cone = (r, h, seg = 5) => new THREE.ConeGeometry(r, h, seg).rotateX(Math.PI / 2); // pointe vers +z

// corps en goutte : profil tourné autour de l'axe, queue (t=0) -> poitrail (t=1)
const bodyProfile = Array.from({ length: 12 }, (_, i) => {
  const t = i / 11;
  return new THREE.Vector2(0.3 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.75)), 0.85) + 0.001, (t - 0.55) * 1.25);
});
const gull = new THREE.Group();
const body = new THREE.Group();
body.position.set(0, 0.58, 0);
body.rotation.x = -0.28; // poitrail relevé
body.add(mesh(new THREE.LatheGeometry(bodyProfile, 9).rotateX(Math.PI / 2), white));
body.add(mesh(new THREE.BoxGeometry(0.26, 0.04, 0.3), white, 0, 0.02, -0.72)); // queue
const wings = [-1, 1].map(s => {
  const w = new THREE.Group();
  w.position.set(s * 0.2, 0.12, 0.18); // épaule
  w.add(mesh(ball, grey, s * 0.05, -0.02, -0.38, 0.11, 0.17, 0.52));
  w.add(mesh(cone(0.08, 0.6).rotateY(Math.PI), black, s * 0.02, 0.02, -0.98, 1, 0.45, 1)); // rémiges noires
  w.add(mesh(ball, white, s * 0.03, 0.05, -1.02, 0.03, 0.02, 0.04));                      // miroir blanc
  body.add(w);
  return w;
});
gull.add(body);
gull.add(mesh(ball, white, 0, 0.9, 0.3, 0.17, 0.2, 0.17)); // cou

const HEAD_Y = 1.08;
const head = new THREE.Group();
head.position.set(0, HEAD_Y, 0.36);
head.add(mesh(ball, white, 0, 0, 0, 0.17, 0.16, 0.21));
const eyes = [-1, 1].map(s => {
  const eye = new THREE.Group();
  eye.position.set(s * 0.1, 0.045, 0.08);
  eye.add(mesh(ball, red, 0, 0, 0, 0.05, 0.05, 0.05));                                                       // cercle orbital
  eye.add(mesh(ball, new THREE.MeshBasicMaterial({ color: 0xf6edc2 }), 0, 0, 0.012, 0.042, 0.042, 0.042)); // iris pâle
  eye.add(mesh(ball, black, 0, 0, 0.038, 0.022, 0.022, 0.022));                                             // pupille
  head.add(eye);
  return eye;
});
head.add(mesh(cone(0.045, 0.3), yellow, 0, -0.02, 0.33));                         // bec supérieur
head.add(mesh(cone(0.022, 0.07, 4).rotateX(Math.PI / 2), yellow, 0, -0.06, 0.45)); // crochet
const jaw = new THREE.Group();
jaw.position.set(0, -0.055, 0.2);
jaw.add(mesh(cone(0.034, 0.24), yellow, 0, 0, 0.11));
jaw.add(mesh(ball, red, 0, -0.012, 0.18, 0.02, 0.022, 0.03)); // tache rouge
head.add(jaw);
gull.add(head);
for (const s of [-1, 1]) {
  gull.add(mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.36, 5), pink, s * 0.09, 0.2, 0.02));
  gull.add(mesh(cone(0.07, 0.16, 3), pink, s * 0.09, 0.015, 0.08, 1, 0.12, 1)); // pied palmé
}
const GULL_S = 0.8;
gull.scale.setScalar(GULL_S);
scene.add(gull);

// ---------- passants : crabes et tortues ----------
const crabMat = mat(0xd2522a, { roughness: 0.6 }), shellMat = mat(0x5f6b3c), skinMat = mat(0x8a9566);
function makeCrab() {
  const g = new THREE.Group(), legs = [];
  g.add(mesh(ball, crabMat, 0, 0.12, 0, 0.2, 0.08, 0.15));
  for (const s of [-1, 1]) {
    g.add(mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.09, 4), crabMat, s * 0.05, 0.22, 0.1));
    g.add(mesh(ball, black, s * 0.05, 0.27, 0.1, 0.022, 0.022, 0.022));
    const claw = new THREE.Group();
    claw.position.set(s * 0.18, 0.12, 0.14);
    claw.add(mesh(ball, crabMat, s * 0.05, 0.02, 0.05, 0.08, 0.05, 0.06));
    g.add(claw); legs.push(claw);
    for (const z of [-0.09, -0.02, 0.05]) {
      const leg = new THREE.Group();
      leg.position.set(s * 0.16, 0.12, z);
      leg.add(mesh(new THREE.BoxGeometry(0.2, 0.02, 0.02).rotateZ(-s * 0.6), crabMat, s * 0.09, -0.05, 0));
      g.add(leg); legs.push(leg);
    }
  }
  g.scale.setScalar(1.4);
  return Object.assign(g, { legs });
}
function makeTurtle() {
  const g = new THREE.Group(), legs = [];
  g.add(mesh(new THREE.SphereGeometry(1, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2), shellMat, 0, 0.08, 0, 0.42, 0.24, 0.52));
  g.add(mesh(ball, skinMat, 0, 0.1, 0.55, 0.09, 0.08, 0.13));
  for (const [x, z, sx, sz] of [[0.36, 0.25, 0.22, 0.08], [0.28, -0.38, 0.12, 0.07]]) for (const s of [-1, 1]) {
    const f = new THREE.Group();
    f.position.set(s * x, 0.06, z);
    f.add(mesh(ball, skinMat, s * sx * 0.8, 0, 0, sx, 0.03, sz));
    g.add(f); legs.push(f);
  }
  return Object.assign(g, { legs });
}
const walkers = [];
let nextSpawn = 6;
function spawn(now) {
  if (Math.random() < 0.35) { // tortue : remonte de la plage vers la mer
    const side = Math.random() < 0.5 ? -1 : 1, t = makeTurtle();
    t.position.set(side * (2.6 + Math.random() * 1.5), 0, 7.5);
    t.rotation.y = Math.PI - side * 0.12;
    Object.assign(t.userData, { kind: 'turtle', speed: 0.6 + Math.random() * 0.25, phase: Math.random() * 6 });
    walkers.push(t); scene.add(t);
  } else { // crabe : traverse de côté, par à-coups
    const dir = Math.random() < 0.5 ? -1 : 1, c = makeCrab();
    c.position.set(-dir * 8, 0, 3.5 + Math.random() * 3);
    c.rotation.y = (Math.random() - 0.5) * 0.6;
    Object.assign(c.userData, { kind: 'crab', dir, speed: 1.1 + Math.random() * 0.8, phase: Math.random() * 6 });
    walkers.push(c); scene.add(c);
  }
  if (Math.random() < 0.6) squawk(now);
}
function updateWalkers(now, dt) {
  if (now > nextSpawn) { nextSpawn = now + 20 + Math.random() * 25; if (walkers.length < 3) spawn(now); }
  for (let i = walkers.length - 1; i >= 0; i--) {
    const w = walkers[i], u = w.userData, p = w.position;
    if (u.kind === 'crab') {
      const moving = Math.sin(now * 1.1 + u.phase) > -0.35;
      if (moving) p.x += u.dir * u.speed * dt;
      w.legs.forEach((l, k) => l.rotation.x = moving ? Math.sin(now * 22 + k * 1.7) * 0.5 : 0);
      w.legs[0].rotation.y = w.legs[4].rotation.y = Math.sin(now * 3 + u.phase) * 0.3; // pinces
    } else {
      const stroke = Math.sin(now * 2.2 + u.phase);
      const v = u.speed * Math.max(0.15, stroke) * dt;
      p.z -= v * Math.cos(w.rotation.y - Math.PI); p.x -= v * Math.sin(w.rotation.y - Math.PI);
      w.legs.forEach((l, k) => l.rotation.y = stroke * 0.6 * (k % 2 ? -1 : 1) * (k < 2 ? 1 : -0.6));
    }
    p.y = sandH(p.x, p.z) + (u.kind === 'turtle' ? Math.max(0, Math.sin(now * 2.2 + u.phase)) * 0.03 : 0);
    if (Math.abs(p.x) > 9 || p.z < -5) { scene.remove(w); walkers.splice(i, 1); }
  }
}

// ---------- lumières ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a7458, 0.5);
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 80 });
sun.target.position.copy(target);
const moon = new THREE.DirectionalLight(0x9fb6ff, 0.3);
moon.target.position.copy(target);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); // contre-jour : débouche la face vue par la caméra
fill.position.set(2, 6, 14);
scene.add(hemi, sun, sun.target, moon, moon.target, fill);

// ---------- passe ASCII ----------
const CHARS = ' .:-=+*o#%@';
const EDGES = '|-' + String.fromCharCode(92) + '/'; // contours : vertical, horizontal, diagonales
const ATLAS = CHARS + EDGES;
const CELL = { w: 2.5, h: 4 };
const rt = new THREE.WebGLRenderTarget(1, 1);
rt.depthTexture = new THREE.DepthTexture(1, 1);
const fontTex = new THREE.CanvasTexture(document.createElement('canvas'));
fontTex.minFilter = fontTex.magFilter = THREE.LinearFilter; fontTex.generateMipmaps = false;
const asciiU = {
  tScene: { value: rt.texture }, tDepth: { value: rt.depthTexture }, tFont: { value: fontTex },
  uRes: { value: new THREE.Vector2() }, uCell: { value: new THREE.Vector2() },
  uN: { value: CHARS.length }, uAtlas: { value: ATLAS.length }, uNear: { value: camera.near }, uFar: { value: camera.far },
};
const asciiScene = new THREE.Scene();
asciiScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: asciiU, depthTest: false,
  vertexShader: `void main(){ gl_Position = vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    uniform sampler2D tScene,tDepth,tFont; uniform vec2 uRes,uCell; uniform float uN,uAtlas,uNear,uFar;
    // 1/z est linéaire à l'écran sur un plan : sa dérivée seconde ne réagit qu'aux vrais contours
    float w(vec2 cell){ float d = texture2D(tDepth,(cell+.5)*uCell/uRes).r; return (uFar-d*(uFar-uNear))/(uNear*uFar); }
    void main(){
      vec2 fc = gl_FragCoord.xy, cell = floor(fc/uCell), lc = fract(fc/uCell);
      vec3 c = pow(max(texture2D(tScene,(cell+.5)*uCell/uRes).rgb,0.), vec3(1./2.2));
      float l = clamp((dot(c,vec3(.299,.587,.114))-.04)*1.15,0.,1.);
      float idx = floor(l*(uN-1.)+.5);
      vec3 col = c*1.25;
      // contours : saut de profondeur entre cellules voisines
      float wc = w(cell), wr = w(cell+vec2(1,0)), wl = w(cell-vec2(1,0)), wu = w(cell+vec2(0,1)), wd = w(cell-vec2(0,1));
      float gx = wr - wl, gy = wu - wd;
      if ((abs(wr+wl-2.*wc) + abs(wu+wd-2.*wc)) / wc > .25) {
        float ax = abs(gx), ay = abs(gy);
        idx = uN + (ax > 2.*ay ? 0. : ay > 2.*ax ? 1. : gx*gy > 0. ? 2. : 3.);
        col = mix(c, vec3(1.), .45)*1.1;
      }
      float m = texture2D(tFont, vec2((idx+lc.x)/uAtlas, lc.y)).r;
      gl_FragColor = vec4(col*m + c*.06, 1.);
    }`,
})));
const orthoCam = new THREE.OrthographicCamera();

function resize() {
  const dpr = Math.min(devicePixelRatio, 2), w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const cw = CELL.w * dpr, ch = CELL.h * dpr;
  asciiU.uRes.value.set(w * dpr, h * dpr);
  asciiU.uCell.value.set(cw, ch);
  rt.setSize(Math.ceil(w / CELL.w) * 2, Math.ceil(h / CELL.h) * 2);
  const fc = fontTex.image;
  const gw = Math.ceil(cw), gh = Math.ceil(ch); // l'atlas veut des pixels entiers
  fc.width = gw * ATLAS.length; fc.height = gh;
  const g = fc.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, fc.width, fc.height);
  g.fillStyle = '#fff'; g.font = `${Math.round(gh * 0.92)}px ui-monospace, Menlo, Consolas, monospace`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  [...ATLAS].forEach((c, i) => g.fillText(c, (i + 0.5) * gw, gh * 0.55));
  fontTex.needsUpdate = true;
}
addEventListener('resize', resize);
resize();

// ---------- heure du jour (scroll) ----------
const C = hex => new THREE.Color(hex);
const PAL = {
  zNight: C(0x02040c), zDay: C(0x2a64c8), zDusk: C(0x3a2a5c),
  hNight: C(0x0b1228), hDay: C(0xa8d2ff), hDusk: C(0xff7a35),
  sunDay: C(0xfff1d6), sunDusk: C(0xff6a1f),
  deepNight: C(0x01040a), deepDay: C(0x0b3f52),
};
const tmp = new THREE.Color();
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const H0 = 6.5; // heure en haut de page ; ?h=12 pour forcer une heure
const params = new URLSearchParams(location.search), forcedH = parseFloat(params.get('h')), RAW = params.has('raw'); // ?raw : rendu 3D sans ASCII
let hours = H0, hoursTarget = H0;
const clockEl = document.getElementById('clock'), phaseEl = document.getElementById('phase');

function applyTime(h) {
  const a = (h - 6) / 24 * Math.PI * 2;
  const sunDir = skyU.uSunDir.value.set(Math.cos(a) * 0.9, Math.sin(a) * 0.4, -2).normalize();
  const moonDir = skyU.uMoonDir.value.set(-Math.cos(a) * 0.9, -Math.sin(a) * 0.4, -2).normalize();
  const e = Math.sin(a); // élévation "logique" (la direction affichée est aplatie pour rester dans le cadre)
  const day = ss(-0.1, 0.35, e), golden = Math.exp(-((e - 0.04) ** 2) / 0.012), night = 1 - ss(-0.3, 0, e);

  skyU.uZenith.value.copy(PAL.zNight).lerp(PAL.zDay, day).lerp(PAL.zDusk, golden * 0.45);
  skyU.uHorizon.value.copy(PAL.hNight).lerp(PAL.hDay, day).lerp(PAL.hDusk, golden * 0.85);
  skyU.uSunCol.value.copy(PAL.sunDay).lerp(PAL.sunDusk, golden);
  skyU.uSunVis.value = ss(-0.06, 0.02, e);
  skyU.uMoonVis.value = ss(-0.06, 0.02, -e) * (0.3 + 0.7 * night);
  skyU.uNight.value = night;
  waterU.uSunI.value = ss(-0.04, 0.06, e) * 1.6;
  waterU.uMoonI.value = ss(-0.04, 0.08, -e) * night;
  waterU.uDeep.value.copy(PAL.deepNight).lerp(PAL.deepDay, day).lerp(PAL.hDusk, golden * 0.08);
  scene.fog.color.copy(skyU.uHorizon.value);

  sun.position.copy(target).addScaledVector(sunDir, 40);
  sun.color.copy(skyU.uSunCol.value);
  sun.intensity = ss(-0.03, 0.12, e) * 2.4;
  sun.castShadow = e > -0.03;
  moon.position.copy(target).addScaledVector(moonDir, 40);
  moon.intensity = ss(-0.04, 0.1, -e) * 1.2;
  hemi.color.copy(skyU.uZenith.value).lerp(C(0xffffff), 0.3);
  hemi.groundColor.copy(tmp.set(0x8a7458)).multiplyScalar(0.3 + day * 0.7);
  hemi.intensity = 0.6 + day * 0.7 + golden * 0.2;
  fill.color.copy(skyU.uHorizon.value).lerp(C(0xffffff), 0.5);
  fill.intensity = 0.35 + day * 1.3;

  const hh = ((Math.floor(h) % 24) + 24) % 24, mm = Math.floor((h % 1) * 60);
  clockEl.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  const label = e < -0.12 ? 'nuit' : e < 0.18 ? (Math.cos(a) > 0 ? 'aube' : 'crépuscule') : 'jour';
  const p = Math.min(1, Math.max(0, (h - H0) / 24)), bar = Math.round(p * 20);
  phaseEl.textContent = `${label.padEnd(11)}[${'='.repeat(bar)}${'-'.repeat(20 - bar)}]`;
}
const readScroll = () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  hoursTarget = isNaN(forcedH) ? H0 + 24 * (max > 0 ? scrollY / max : 0) : forcedH;
  if (!isNaN(forcedH)) hours = forcedH;
};
addEventListener('scroll', readScroll, { passive: true });
readScroll();

// ---------- souris : orbite + regard ----------
const mouse = new THREE.Vector2(), mousePx = new THREE.Vector2(innerWidth / 2, innerHeight / 2);
let orbit = { az: 0, el: 0.13 }, mouseSpeed = 0, lastMove = 0;
addEventListener('pointermove', ev => {
  const nx = ev.clientX / innerWidth * 2 - 1, ny = -(ev.clientY / innerHeight) * 2 + 1;
  mouseSpeed += Math.hypot(nx - mouse.x, ny - mouse.y);
  mouse.set(nx, ny);
  mousePx.set(ev.clientX, ev.clientY);
  lastMove = performance.now() / 1000;
});

// ---------- cri ----------
let actx = null, squawkT = 0, lastSquawk = -10;
const soundBtn = document.getElementById('sound'), bubble = document.getElementById('bubble');
soundBtn.addEventListener('click', ev => {
  ev.stopPropagation();
  if (actx) { actx.close(); actx = null; } else { actx = new AudioContext(); squawk(performance.now() / 1000, true); }
  soundBtn.textContent = `[ son : ${actx ? 'on' : 'off'} ]`;
});
const CRIS = ['KRIIAAA !', 'KYAA KYAA !', 'HÉ ! TOI !', 'KAAAH !', 'MIAAOU ?!'];
function squawk(now, force = false) {
  if (!force && now - lastSquawk < 2.2) return;
  lastSquawk = now; squawkT = 0.7;
  bubble.textContent = `< ${CRIS[Math.floor(Math.random() * CRIS.length)]} >`;
  bubble.style.opacity = 1;
  if (!actx) return;
  const t0 = actx.currentTime;
  for (let k = 0; k < 3; k++) {
    const t = t0 + k * 0.2, o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(1300 + Math.random() * 400, t);
    o.frequency.exponentialRampToValueAtTime(650, t + 0.17);
    f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 4;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.3, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
    o.connect(f).connect(g).connect(actx.destination);
    o.start(t); o.stop(t + 0.2);
  }
}
canvas.addEventListener('pointerdown', () => squawk(performance.now() / 1000, true));

// ---------- boucle ----------
const ray = new THREE.Raycaster(), look = new THREE.Vector3(), headW = new THREE.Vector3(), lp = new THREE.Vector3();
const bowLocal = new THREE.Vector3(L / 2 - 0.25, sheer(0.92), 0);
let blinkAt = 3, tiltAt = 2, tilt = 0, prev = performance.now() / 1000;

function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.05, now - prev); prev = now;
  hours += (hoursTarget - hours) * Math.min(1, dt * 4);
  applyTime(hours);
  skyU.uTime.value = waterU.uTime.value = now;

  orbit.az += (mouse.x * 0.75 - orbit.az) * Math.min(1, dt * 2.5);
  orbit.el += (0.13 + mouse.y * 0.1 - orbit.el) * Math.min(1, dt * 2.5);
  const r = 9.5;
  camera.position.set(target.x + Math.sin(orbit.az) * Math.cos(orbit.el) * r, target.y + Math.sin(orbit.el) * r, target.z + Math.cos(orbit.az) * Math.cos(orbit.el) * r);
  camera.lookAt(target);

  // mouette sur la proue
  boatRoot.updateMatrixWorld(true);
  gull.position.copy(boat.localToWorld(bowLocal.clone()));
  gull.rotation.y = 0.25;
  gull.scale.y = GULL_S * (1 + Math.sin(now * 2) * 0.015);
  updateWalkers(now, dt);

  // regarde la souris ; si elle ne bouge plus, suit un passant
  head.getWorldPosition(headW);
  if (now - lastMove > 2.5 && walkers.length) look.copy(walkers[0].position).y += 0.2;
  else { ray.setFromCamera(mouse, camera); ray.ray.at(camera.position.distanceTo(headW) * 0.75, look); }
  lp.copy(look); head.parent.worldToLocal(lp).sub(head.position);
  const yaw = THREE.MathUtils.clamp(Math.atan2(lp.x, lp.z), -1.3, 1.3);
  const pitch = THREE.MathUtils.clamp(-Math.atan2(lp.y, Math.hypot(lp.x, lp.z)), -0.7, 0.6);
  head.rotation.y += (yaw * 0.7 - head.rotation.y) * Math.min(1, dt * 6);
  head.rotation.x += (pitch * 0.7 - head.rotation.x) * Math.min(1, dt * 6);
  eyes.forEach(e => e.lookAt(look));

  if (now > blinkAt) blinkAt = now + 2.5 + Math.random() * 4;
  const blink = blinkAt - now > 0.12 ? 1 : 0.1;
  eyes.forEach(e => e.scale.y = blink);

  // piaille après la souris : approche ou geste brusque
  camera.updateMatrixWorld();
  const sp = headW.clone().project(camera);
  const sx = (sp.x + 1) / 2 * innerWidth, sy = (1 - sp.y) / 2 * innerHeight;
  if (Math.hypot(sx - mousePx.x, sy - mousePx.y) < 90 || mouseSpeed > 0.35) squawk(now);
  mouseSpeed *= Math.max(0, 1 - dt * 8);

  squawkT = Math.max(0, squawkT - dt);
  jaw.rotation.x = squawkT > 0 ? 0.5 * Math.abs(Math.sin(squawkT * 28)) : 0;
  head.position.y = HEAD_Y + (squawkT > 0 ? Math.sin(squawkT * 28) * 0.03 : 0);
  wings.forEach((w, k) => w.rotation.z = (k ? 1 : -1) * (squawkT > 0 ? 0.35 * Math.abs(Math.sin(squawkT * 14)) : 0));
  if (now > tiltAt) { tiltAt = now + 3 + Math.random() * 5; tilt = (Math.random() - 0.5) * 0.7; }
  head.rotation.z += (tilt - head.rotation.z) * Math.min(1, dt * 4);
  bubble.style.transform = `translate(${sx + 30}px, ${sy - 60}px)`;
  if (squawkT === 0) bubble.style.opacity = 0;

  if (RAW) renderer.render(scene, camera);
  else {
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(asciiScene, orthoCam);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
