services:
  app:
    build: .
    container_name: barque-echouee
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.barque-echouee.rule=Host(`barque-echouee.${DOMAIN}`)
      - traefik.http.routers.barque-echouee.entrypoints=websecure
      - traefik.http.routers.barque-echouee.tls.certresolver=le
      - traefik.http.services.barque-echouee.loadbalancer.server.port=80
    networks:
      - web

networks:
  web:
    external: true
